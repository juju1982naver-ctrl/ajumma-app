name: 화면 크기 점검

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get install -y fonts-nanum
      - name: 화면 점검 실행
        id: t
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: 결과 그림 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls app/build/ui-shots || true
          gh release delete ui-shots --yes --cleanup-tag || true
          gh release create ui-shots --prerelease --title "화면 점검 그림" --notes "자동 생성" app/build/ui-shots/* || true
      - name: 실패면 표시
        if: steps.t.outcome == 'failure'
        run: |
          cat app/build/ui-shots/report.md || true
          exit 1
