name: APK 만들기

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ajumma5.apk

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: ajumma5-apk
          path: ajumma5.apk

      - name: 최신 APK를 Releases에 올리기
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ajumma5.apk \
            --title "아줌마 5인방 최신 버전 (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 ajumma5.apk를 눌러 받은 뒤 설치하세요."
